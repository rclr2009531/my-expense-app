<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>極簡智慧記帳</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <!-- Tailwind CSS & Chart.js CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans pb-24">

  <!-- 頂部標題與總進度 -->
  <header class="bg-white px-5 pt-10 pb-4 shadow-sm border-b">
    <div class="flex justify-between items-center mb-2">
      <h1 class="text-xl font-bold tracking-tight">財務概況</h1>
      <span id="current-month" class="text-xs font-semibold px-2.5 py-1 bg-gray-100 rounded-full text-gray-600">--月</span>
    </div>
    <div class="mt-3">
      <div class="flex justify-between text-xs text-gray-500 mb-1">
        <span>已花費：<strong id="total-spent" class="text-gray-800 font-bold">$0</strong></span>
        <span>總預算：<strong id="total-budget-display" class="text-gray-800 font-bold">$0</strong></span>
      </div>
      <div class="w-full bg-gray-200 h-2.5 rounded-full overflow-hidden">
        <div id="total-progress-bar" class="bg-emerald-500 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
      </div>
    </div>
  </header>

  <!-- 主內容區塊 (切換分頁) -->
  <main class="max-w-md mx-auto p-4">

    <!-- TAB 1: 極速記帳 -->
    <section id="tab-log" class="space-y-4">
      <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
        <label class="block text-xs font-semibold text-gray-400 mb-1">輸入金額</label>
        <div class="relative mb-4">
          <span class="absolute left-3 top-2.5 text-2xl font-bold text-gray-400">$</span>
          <input id="input-amount" type="number" inputmode="decimal" placeholder="0" class="w-full pl-8 pr-3 py-2 text-3xl font-bold bg-transparent border-b-2 border-gray-200 focus:border-emerald-500 focus:outline-none">
        </div>

        <label class="block text-xs font-semibold text-gray-400 mb-2">選擇分類</label>
        <div class="grid grid-cols-2 gap-2.5 mb-4">
          <button onclick="selectCategory('飲食')" class="cat-btn border border-gray-200 py-3 rounded-xl flex items-center justify-center gap-2 font-medium hover:border-emerald-500 hover:bg-emerald-50" data-cat="飲食">
            🍱 飲食
          </button>
          <button onclick="selectCategory('交通')" class="cat-btn border border-gray-200 py-3 rounded-xl flex items-center justify-center gap-2 font-medium hover:border-emerald-500 hover:bg-emerald-50" data-cat="交通">
            🚇 交通
          </button>
          <button onclick="selectCategory('固定支出')" class="cat-btn border border-gray-200 py-3 rounded-xl flex items-center justify-center gap-2 font-medium hover:border-emerald-500 hover:bg-emerald-50" data-cat="固定支出">
            🏠 固定支出
          </button>
          <button onclick="selectCategory('變動支出')" class="cat-btn border border-gray-200 py-3 rounded-xl flex items-center justify-center gap-2 font-medium hover:border-emerald-500 hover:bg-emerald-50" data-cat="變動支出">
            🛍️ 變動支出
          </button>
        </div>

        <input id="input-note" type="text" placeholder="備註（選填，例：晚餐拉麵）" class="w-full px-3 py-2 text-sm bg-gray-50 border rounded-xl mb-4 focus:outline-none focus:ring-1 focus:ring-emerald-500">

        <button onclick="saveRecord()" class="w-full bg-emerald-600 text-white font-bold py-3.5 rounded-xl shadow-md active:scale-95 transition-transform">
          記錄這筆支出
        </button>
      </div>

      <!-- 今日記錄清單 -->
      <div>
        <h2 class="text-sm font-bold text-gray-500 mb-2 px-1">近期花費</h2>
        <div id="recent-list" class="space-y-2">
          <!-- 動態插入 -->
        </div>
      </div>
    </section>

    <!-- TAB 2: 預算管理 -->
    <section id="tab-budget" class="space-y-4 hidden">
      <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
        <h2 class="text-base font-bold mb-4">預算設定 (月)</h2>
        <div class="space-y-3">
          <div>
            <label class="text-xs text-gray-500 font-medium">總月預算</label>
            <input id="budget-total" type="number" class="w-full border rounded-xl px-3 py-2 mt-1 text-sm font-semibold" placeholder="例如：30000">
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-xs text-gray-500">🍱 飲食預算</label>
              <input id="budget-飲食" type="number" class="w-full border rounded-xl px-3 py-2 mt-1 text-sm" placeholder="10000">
            </div>
            <div>
              <label class="text-xs text-gray-500">🚇 交通預算</label>
              <input id="budget-交通" type="number" class="w-full border rounded-xl px-3 py-2 mt-1 text-sm" placeholder="2000">
            </div>
            <div>
              <label class="text-xs text-gray-500">🏠 固定預算</label>
              <input id="budget-固定支出" type="number" class="w-full border rounded-xl px-3 py-2 mt-1 text-sm" placeholder="12000">
            </div>
            <div>
              <label class="text-xs text-gray-500">🛍️ 變動預算</label>
              <input id="budget-變動支出" type="number" class="w-full border rounded-xl px-3 py-2 mt-1 text-sm" placeholder="6000">
            </div>
          </div>
          <button onclick="saveBudgets()" class="w-full mt-2 bg-gray-800 text-white font-semibold py-2.5 rounded-xl text-sm">
            更新預算
          </button>
        </div>
      </div>

      <!-- 各類別進度條 -->
      <div id="category-progress-list" class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 space-y-4">
        <!-- 動態渲染各分類預算水位 -->
      </div>
    </section>

    <!-- TAB 3: 視覺化圖表與洞察 -->
    <section id="tab-insight" class="space-y-4 hidden">
      <!-- 智慧洞察卡片 -->
      <div id="insight-cards" class="space-y-2">
        <!-- 動態產生超支警報、平日週末分析、異常通知 -->
      </div>

      <!-- 圓餅圖 -->
      <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
        <h3 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">支出分類佔比</h3>
        <div class="w-full max-w-[260px] mx-auto">
          <canvas id="pieChart"></canvas>
        </div>
      </div>

      <!-- 平日 vs 週末開銷 -->
      <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
        <h3 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">平日 vs. 週末日均支出</h3>
        <canvas id="barChart" height="150"></canvas>
      </div>
    </section>

  </main>

  <!-- 底部導覽列 -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t flex justify-around py-2.5 max-w-md mx-auto z-50">
    <button onclick="switchTab('log')" id="nav-log" class="flex flex-col items-center gap-1 text-emerald-600 font-semibold text-xs">
      <i class="fa-solid fa-pen-to-square text-lg"></i>
      <span>記帳</span>
    </button>
    <button onclick="switchTab('budget')" id="nav-budget" class="flex flex-col items-center gap-1 text-gray-400 font-semibold text-xs">
      <i class="fa-solid fa-wallet text-lg"></i>
      <span>預算</span>
    </button>
    <button onclick="switchTab('insight')" id="nav-insight" class="flex flex-col items-center gap-1 text-gray-400 font-semibold text-xs">
      <i class="fa-solid fa-chart-pie text-lg"></i>
      <span>洞察</span>
    </button>
  </nav>

  <!-- App 核心運算邏輯 -->
  <script>
    const CATEGORIES = ['飲食', '交通', '固定支出', '變動支出'];
    let selectedCat = '飲食';
    let records = JSON.parse(localStorage.getItem('my_records') || '[]');
    let budgets = JSON.parse(localStorage.getItem('my_budgets') || JSON.stringify({
      total: 30000, '飲食': 10000, '交通': 2000, '固定支出': 12000, '變動支出': 6000
    }));

    let pieChartInstance = null;
    let barChartInstance = null;

    function init() {
      const now = new Date();
      document.getElementById('current-month').innerText = `${now.getMonth() + 1} 月`;
      updateCatButtons();
      loadBudgetsToUI();
      renderDashboard();
    }

    function switchTab(tab) {
      ['log', 'budget', 'insight'].forEach(t => {
        document.getElementById(`tab-${t}`).classList.add('hidden');
        document.getElementById(`nav-${t}`).className = 'flex flex-col items-center gap-1 text-gray-400 font-semibold text-xs';
      });
      document.getElementById(`tab-${tab}`).classList.remove('hidden');
      document.getElementById(`nav-${tab}`).className = 'flex flex-col items-center gap-1 text-emerald-600 font-semibold text-xs';

      if (tab === 'insight') {
        renderInsights();
      }
    }

    function selectCategory(cat) {
      selectedCat = cat;
      updateCatButtons();
    }

    function updateCatButtons() {
      document.querySelectorAll('.cat-btn').forEach(btn => {
        if (btn.dataset.cat === selectedCat) {
          btn.className = 'cat-btn border-2 border-emerald-500 bg-emerald-50 text-emerald-700 py-3 rounded-xl flex items-center justify-center gap-2 font-bold shadow-sm';
        } else {
          btn.className = 'cat-btn border border-gray-200 py-3 rounded-xl flex items-center justify-center gap-2 font-medium hover:border-gray-300';
        }
      });
    }

    function saveRecord() {
      const amount = parseFloat(document.getElementById('input-amount').value);
      const note = document.getElementById('input-note').value.trim();
      if (!amount || amount <= 0) return alert('請輸入有效金額！');

      const record = {
        id: Date.now(),
        amount: amount,
        category: selectedCat,
        note: note || selectedCat,
        date: new Date().toISOString()
      };

      records.unshift(record);
      localStorage.setItem('my_records', JSON.stringify(records));

      document.getElementById('input-amount').value = '';
      document.getElementById('input-note').value = '';
      renderDashboard();
    }

    function deleteRecord(id) {
      records = records.filter(r => r.id !== id);
      localStorage.setItem('my_records', JSON.stringify(records));
      renderDashboard();
    }

    function renderDashboard() {
      const currentMonth = new Date().getMonth();
      const currentYear = new Date().getFullYear();

      // 過濾本月紀錄
      const thisMonthRecords = records.filter(r => {
        const d = new Date(r.date);
        return d.getMonth() === currentMonth && d.getFullYear() === currentYear;
      });

      const totalSpent = thisMonthRecords.reduce((sum, r) => sum + r.amount, 0);
      document.getElementById('total-spent').innerText = `$${totalSpent.toLocaleString()}`;
      document.getElementById('total-budget-display').innerText = `$${(budgets.total || 0).toLocaleString()}`;

      // 進度條
      const ratio = budgets.total > 0 ? (totalSpent / budgets.total) * 100 : 0;
      const bar = document.getElementById('total-progress-bar');
      bar.style.width = `${Math.min(ratio, 100)}%`;
      bar.className = `h-2.5 rounded-full transition-all duration-300 ${ratio > 100 ? 'bg-rose-500' : ratio > 80 ? 'bg-amber-500' : 'bg-emerald-500'}`;

      // 渲染近期花費 (前 10 筆)
      const list = document.getElementById('recent-list');
      list.innerHTML = records.slice(0, 10).map(r => `
        <div class="flex justify-between items-center bg-white p-3.5 rounded-xl border border-gray-100 shadow-sm">
          <div>
            <div class="font-bold text-gray-800 text-sm">${r.note}</div>
            <div class="text-[11px] text-gray-400">${new Date(r.date).toLocaleDateString()} · ${r.category}</div>
          </div>
          <div class="flex items-center gap-3">
            <span class="font-bold text-sm text-gray-900">-$${r.amount.toLocaleString()}</span>
            <button onclick="deleteRecord(${r.id})" class="text-gray-300 hover:text-rose-500"><i class="fa-solid fa-trash-can text-xs"></i></button>
          </div>
        </div>
      `).join('');

      // 渲染分類預算進度
      renderCategoryProgress(thisMonthRecords);
    }

    function renderCategoryProgress(thisMonthRecords) {
      const container = document.getElementById('category-progress-list');
      const catSpend = {};
      CATEGORIES.forEach(c => catSpend[c] = 0);
      thisMonthRecords.forEach(r => catSpend[r.category] = (catSpend[r.category] || 0) + r.amount);

      container.innerHTML = '<h3 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">分類預算監控</h3>' +
        CATEGORIES.map(cat => {
          const spent = catSpend[cat] || 0;
          const limit = budgets[cat] || 1;
          const pct = Math.min((spent / limit) * 100, 100);
          const isOver = spent > limit;
          return `
            <div>
              <div class="flex justify-between text-xs mb-1">
                <span class="font-medium">${cat}</span>
                <span class="${isOver ? 'text-rose-500 font-bold' : 'text-gray-500'}">$${spent.toLocaleString()} / $${limit.toLocaleString()}</span>
              </div>
              <div class="w-full bg-gray-100 h-2 rounded-full overflow-hidden">
                <div class="${isOver ? 'bg-rose-500' : pct > 80 ? 'bg-amber-500' : 'bg-emerald-500'} h-2 rounded-full" style="width: ${pct}%"></div>
              </div>
            </div>
          `;
        }).join('');
    }

    function saveBudgets() {
      budgets.total = parseFloat(document.getElementById('budget-total').value) || 0;
      CATEGORIES.forEach(cat => {
        budgets[cat] = parseFloat(document.getElementById(`budget-${cat}`).value) || 0;
      });
      localStorage.setItem('my_budgets', JSON.stringify(budgets));
      alert('預算更新成功！');
      renderDashboard();
    }

    function loadBudgetsToUI() {
      document.getElementById('budget-total').value = budgets.total || '';
      CATEGORIES.forEach(cat => {
        document.getElementById(`budget-${cat}`).value = budgets[cat] || '';
      });
    }

    // ====== 智慧洞察引擎 (Insights Engine) ======
    function renderInsights() {
      const now = new Date();
      const currentMonth = now.getMonth();
      const currentYear = now.getFullYear();
      const dayOfMonth = now.getDate();
      const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();

      const thisMonthRecords = records.filter(r => {
        const d = new Date(r.date);
        return d.getMonth() === currentMonth && d.getFullYear() === currentYear;
      });

      const totalSpent = thisMonthRecords.reduce((sum, r) => sum + r.amount, 0);
      const cards = [];

      // 1. 超支預警演算法 (Burn-Rate Projection)
      if (budgets.total > 0 && dayOfMonth > 1) {
        const dailyRate = totalSpent / dayOfMonth;
        const projectedMonthSpend = dailyRate * totalDays;
        const diff = projectedMonthSpend - budgets.total;

        if (diff > 0) {
          const safeDaily = Math.max(0, (budgets.total - totalSpent) / (totalDays - dayOfMonth));
          cards.push(`
            <div class="bg-rose-50 border border-rose-200 p-4 rounded-xl">
              <div class="flex items-center gap-2 text-rose-700 font-bold text-sm">
                <i class="fa-solid fa-triangle-exclamation"></i> 超支預警
              </div>
              <p class="text-xs text-rose-600 mt-1 leading-relaxed">
                照目前燃燒速度，月底預計花費 <strong>$${Math.round(projectedMonthSpend).toLocaleString()}</strong>（超支 $${Math.round(diff).toLocaleString()}）。建議接下來每日花費控制在 <strong>$${Math.round(safeDaily).toLocaleString()}</strong> 以內。
              </p>
            </div>
          `);
        } else {
          cards.push(`
            <div class="bg-emerald-50 border border-emerald-200 p-4 rounded-xl">
              <div class="flex items-center gap-2 text-emerald-700 font-bold text-sm">
                <i class="fa-solid fa-circle-check"></i> 預算健康
              </div>
              <p class="text-xs text-emerald-600 mt-1">目前進度掌控良好，預估月底將結餘 $${Math.round(-diff).toLocaleString()} 元！</p>
            </div>
          `);
        }
      }

      // 2. 平日 vs 週末開銷分析
      let weekdaySum = 0, weekdayCount = 0;
      let weekendSum = 0, weekendCount = 0;
      thisMonthRecords.forEach(r => {
        const day = new Date(r.date).getDay();
        if (day === 0 || day === 6) {
          weekendSum += r.amount;
        } else {
          weekdaySum += r.amount;
        }
      });
      // 粗估本月已過平日/週末天數
      for (let i = 1; i <= dayOfMonth; i++) {
        const d = new Date(currentYear, currentMonth, i).getDay();
        (d === 0 || d === 6) ? weekendCount++ : weekdayCount++;
      }
      const weekdayAvg = weekdayCount > 0 ? (weekdaySum / weekdayCount) : 0;
      const weekendAvg = weekendCount > 0 ? (weekendSum / weekendCount) : 0;

      if (weekendAvg > weekdayAvg * 1.5 && weekendAvg > 0) {
        cards.push(`
          <div class="bg-amber-50 border border-amber-200 p-4 rounded-xl">
            <div class="flex items-center gap-2 text-amber-700 font-bold text-sm">
              <i class="fa-solid fa-beer-mug-empty"></i> 週末開銷模式
            </div>
            <p class="text-xs text-amber-600 mt-1">
              你的週末平均花費（$${Math.round(weekendAvg)}）是平日（$${Math.round(weekdayAvg)}）的 <strong>${(weekendAvg/weekdayAvg).toFixed(1)} 倍</strong>，假日的社交或變動消費是主要推手！
            </p>
          </div>
        `);
      }

      // 3. 異常花費偵測 (某類別佔比過高)
      const catSpend = {};
      CATEGORIES.forEach(c => catSpend[c] = 0);
      thisMonthRecords.forEach(r => catSpend[r.category] += r.amount);

      if (totalSpent > 0 && (catSpend['變動支出'] / totalSpent) > 0.35) {
        cards.push(`
          <div class="bg-indigo-50 border border-indigo-200 p-4 rounded-xl">
            <div class="flex items-center gap-2 text-indigo-700 font-bold text-sm">
              <i class="fa-solid fa-wand-magic-sparkles"></i> 習慣追蹤：衝動消費警訊
            </div>
            <p class="text-xs text-indigo-600 mt-1">
              本月「變動支出」已佔總開銷的 <strong>${Math.round((catSpend['變動支出'] / totalSpent) * 100)}%</strong>，稍微超出了理想警戒線（30%）。
            </p>
          </div>
        `);
      }

      document.getElementById('insight-cards').innerHTML = cards.join('') || '<div class="text-xs text-gray-400 text-center py-4">記錄更多資料後，AI 會在此自動顯示花費模式洞察！</div>';

      // 繪製圓餅圖
      const pieCtx = document.getElementById('pieChart').getContext('2d');
      if (pieChartInstance) pieChartInstance.destroy();
      pieChartInstance = new Chart(pieCtx, {
        type: 'doughnut',
        data: {
          labels: CATEGORIES,
          datasets: [{
            data: CATEGORIES.map(c => catSpend[c]),
            backgroundColor: ['#10b981', '#3b82f6', '#6366f1', '#f59e0b']
          }]
        },
        options: { plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } } } }
      });

      // 繪製長條圖
      const barCtx = document.getElementById('barChart').getContext('2d');
      if (barChartInstance) barChartInstance.destroy();
      barChartInstance = new Chart(barCtx, {
        type: 'bar',
        data: {
          labels: ['平日日均', '週末日均'],
          datasets: [{
            label: '平均支出 ($)',
            data: [Math.round(weekdayAvg), Math.round(weekendAvg)],
            backgroundColor: ['#64748b', '#f97316'],
            borderRadius: 8
          }]
        },
        options: {
          scales: { y: { beginAtZero: true } },
          plugins: { legend: { display: false } }
        }
      });
    }

    // 啟動
    init();
  </script>
</body>
</html>
